<section class="card">
  <div class="card-inner">
    <div class="card__item" *ngFor="let user of users">
      <h4 class="card__title">{{ user.name }}</h4>
      <p class="card___desc">{{ user.email }}</p>
      <p class="card__street">{{ user.address.street }}</p>

      <button class="card__btn" (click)="deleteUser(user.id)">
        Удалить юзера
      </button>
    </div>
  </div>
</section>
