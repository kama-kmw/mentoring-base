<button
  type="submit"
  mat-raised-button
  (click)="openDialogCreateUser()"
  class="create-user__btn"
>
  Создать пользователя
</button>

<section class="card">
  <div class="card-inner">
    <div *ngFor="let user of users$ | async">
      <app-user-card
        [user]="user"
        (deleteUser)="deleteUser($event)"
        (editUser)="editUser($event)"
      ></app-user-card>
    </div>
  </div>
</section>
