<h1 class="form-title">Добавить задачу</h1>
<div class="form-section">
  <form [formGroup]="form" (ngSubmit)="submitForm()">
    <p>Текст задачи</p>
    <input type="text" formControlName="title" />
    <div
    *ngIf="form.controls['title'].invalid && (form.controls['title'].dirty || form.controls['title'].touched)" class="alert"
  >
    <div *ngIf="form.controls['title'].errors" style="color: red">
      Введите коректное имя
    </div>
  </div>

    <p>Автор задачи</p>
    <input type="text" formControlName="userId" />

    <p>ЗАДАЧА ЗАВЕРШЕНА</p>
    <select formControlName="completed" class="gustom-select">
      <option [value]="true">Да</option>
      <option [value]="false">Нет</option>
    </select>
    <button type="submit" class="form__btn" [disabled]="form.invalid">
      СОЗДАТЬ ЗАДАЧУ
    </button>
  </form>
</div>
