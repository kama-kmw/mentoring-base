<h1 class="form__title">Добавить задачу</h1>
<div class="form-section">
  <form [formGroup]="form" class="form__todo" (ngSubmit)="submitForm()">
    <mat-form-field class="form__field">
      <mat-label>Текст задачи</mat-label>
      <input matInput class="form__input" formControlName="title" />
      <mat-error>Введите коректное название задачи!</mat-error>
    </mat-form-field> 

    <mat-form-field class="form__field">
      <mat-label>Автор задачи</mat-label>
      <input matInput class="form__input" formControlName="userId" />
      <mat-error>Введите коректное название!</mat-error>
    </mat-form-field>

    <mat-form-field class="form__field">
      <mat-label>Задача завершена</mat-label>
      <input matInput class="form__input" formControlName="completed" />
    </mat-form-field>

    <button mat-raised-button [disabled]="form.invalid" class="form__btn">
      СОЗДАТЬ ЗАДАЧУ
    </button>
  </form>
</div>
