<button
  type="submit"
  mat-raised-button
  (click)="openDialogCreateTodo()"
  class="create-user__btn"
>
  Создать задачу
</button>
<section class="card">
  <div class="card-inner">
    <div *ngFor="let todo of todoService.todos$ | async">
      <app-todos-card
        [todo]="todo"
        (deleteTodo)="deleteTodo($event)"
      ></app-todos-card>
    </div>
  </div>
</section>
