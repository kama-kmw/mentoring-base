<app-create-todo-form (createTodo)="createTodo($event)"></app-create-todo-form>
<section class="card">
  <div class="card-inner">
    <div *ngFor="let todo of todoService.todos$ | async">
      <app-todos-card
        [todo]="todo"
        (deleteTodo)="deleteTodo($event)"
      ></app-todos-card>
    </div>
  </div>
</section>
